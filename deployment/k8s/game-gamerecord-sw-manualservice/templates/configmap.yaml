apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-sw-manualservice.name" . }}
  labels:
    {{- include "game-gamerecord-sw-manualservice.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "SWTF",
        "IntervalMinutes": 3,
        "IntervalMinutesMax": 60,
        "IntervalMinutesMinimum": 1,
        "LockMinute": 2
      },
      "GameRecord": {
         "GameCommandClientBaseUrl": "http://game-gamecommand/",
         "GameInterfaceBaseUrl": "http://game-gameinterface-sw-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
