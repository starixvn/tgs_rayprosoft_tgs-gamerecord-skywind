apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-sw-service.name" . }}
  labels:
    {{- include "game-gamerecord-sw-service.labels" . | nindent 4 }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "SWTF",
        "MinimumIntervalMinute": 1,
        "IntervalMinute": 3,
        "LockMinute": 1.5
      },
      "GameRecord": {
         "GameProvidersQueryServerBaseUrl": "http://game-gameprovider-queryserver/",
         "GameInterfaceSkywindBaseUrl": "http://game-gameinterface-sw-service:9090/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
